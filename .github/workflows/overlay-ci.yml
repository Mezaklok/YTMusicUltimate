name: Validate offline stability overlay

on:
  pull_request:
    paths:
      - "OfflineFix/**"
      - ".github/workflows/overlay-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install build tools
        run: brew install make ldid

      - name: Configure Theos
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Cache Theos
        id: theos
        uses: actions/cache@v5.0.3
        with:
          path: theos/
          key: theos-344ee5925df036dbd1312b783ad5a00d153c2445

      - name: Set up Theos
        if: steps.theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v6.0.2
        with:
          repository: theos/theos
          ref: 344ee5925df036dbd1312b783ad5a00d153c2445
          path: theos
          submodules: recursive

      - name: Download iOS SDK
        if: steps.theos.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk $THEOS/sdks

      - name: Compile overlay
        run: |
          cd OfflineFix
          make clean package DEBUG=0 FINALPACKAGE=1

